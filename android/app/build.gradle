/*
 * Pistonville pour Android : le jeu (une seule page HTML, construite par
 * tools/build-pistonville.mjs dans pistonville/dist/android/) tourne dans une
 * WebView, entièrement sur le téléphone, sans connexion.
 *
 * Pour une mise à jour sur Google Play : augmenter versionCode (+1 à chaque
 * envoi) et versionName, puis voir android/LISEZMOI.md.
 *
 * Publicités (AdMob) : identifiants lus dans android/monetisation.properties ;
 * sans ce fichier, ce sont les identifiants de TEST de Google (pubs factices).
 */
plugins {
    id 'com.android.application'
}
// Statistiques Firebase : seulement si le fichier du projet Firebase est là (voir LISEZMOI.md).
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'

android {
    namespace 'fr.pistonville.jeu'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.pistonville.jeu'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'

        def monetisation = new Properties()
        def fichierPubs = rootProject.file('monetisation.properties')
        if (fichierPubs.exists()) fichierPubs.withInputStream { monetisation.load(it) }
        // Identifiants de test publiés par Google : à remplacer par les tiens (voir LISEZMOI.md).
        manifestPlaceholders = [admobAppId: monetisation.getProperty('admobAppId', 'ca-app-pub-3940256099942544~3347511713')]
        resValue 'string', 'pub_recompensee', monetisation.getProperty('pubRecompensee', 'ca-app-pub-3940256099942544/5224354917')
        resValue 'string', 'produit_fondateur', monetisation.getProperty('produitFondateur', 'fondateur')
    }

    // La clé d'envoi Google Play : lue dans android/signature.properties (jamais dans Git).
    def proprietes = new Properties()
    def fichier = rootProject.file('signature.properties')
    if (fichier.exists()) fichier.withInputStream { proprietes.load(it) }
    signingConfigs {
        envoi {
            if (fichier.exists()) {
                storeFile rootProject.file(proprietes['fichier'])
                storePassword proprietes['motDePasse']
                keyAlias proprietes['alias']
                keyPassword proprietes['motDePasse']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (fichier.exists()) signingConfig signingConfigs.envoi
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'          // publicités récompensées
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'     // consentement (Europe)
    implementation 'com.android.billingclient:billing:9.1.0'                  // Pack du fondateur
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'                   // statistiques de jeu
    implementation 'androidx.preference:preference:1.2.1'                     // lecture du consentement (TCF)
}

// Le jeu lui-même : copié depuis l'édition store avant chaque construction.
def copierJeu = tasks.register('copierJeu', Copy) {
    from "${rootDir}/../pistonville/dist/android/index.html"
    into "${projectDir}/src/main/assets"
}
tasks.named('preBuild') { dependsOn copierJeu }
