services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: moteur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moteur}
      POSTGRES_DB: moteur
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moteur"]
      interval: 5s
      retries: 10
    mem_limit: 2g

  moteur:
    build: .
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    # 16 Go au total : ~2 Go pour PostgreSQL, le reste pour les calculs, marge pour le système.
    mem_limit: 12g

volumes:
  pgdata:
