services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: moteur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moteur}
      POSTGRES_DB: moteur
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moteur"]
      interval: 5s
      retries: 10
    mem_limit: 2g

  moteur:
    build: .
    restart: always
    # Aucun fichier .env n'est nécessaire : tout se règle dans l'interface web.
    # Un fichier .env reste possible pour qui préfère (voir .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      MOTEUR_DATABASE_URL: postgresql+psycopg://moteur:${POSTGRES_PASSWORD:-moteur}@db:5432/moteur
      MOTEUR_DOSSIER_DONNEES: /app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"   # interface web : http://<adresse-du-serveur>:8080
    volumes:
      - ./data:/app/data
    # 16 Go au total : ~2 Go pour PostgreSQL, le reste pour les calculs, marge pour le système.
    mem_limit: 12g

volumes:
  pgdata:
