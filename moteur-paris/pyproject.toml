[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moteur-paris"
version = "0.1.0"
description = "Moteur d'analyse de paris sportifs : probabilités, chasseurs d'erreurs, gestion du capital."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
moteur = "moteur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
