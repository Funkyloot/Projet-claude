[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moteur-paris"
version = "0.5.6"
description = "Moteur d'analyse de paris sportifs : probabilités, chasseurs d'erreurs, gestion du capital."
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
moteur = "moteur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"moteur.web" = ["gabarits/*.html", "statique/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
