{% extends "base.html" %}
{% block contenu %}
<h1>Outils de calcul</h1>
{% if resultat %}<div class="message">{{ resultat|join('\n') }}</div>{% endif %}
<div class="grille">
<div class="carte"><h2>Value d'un pari</h2>
<form method="post" action="/outils" style="display:grid;gap:10px">
<input type="hidden" name="outil" value="value">
<label>Probabilité (%, voir la fiche)<input name="proba" id="v-proba" inputmode="decimal" required></label>
<label>Cote 22bet<input name="cote_saisie" id="v-cote" inputmode="decimal" required></label>
<label>Capital (vide = capital de départ)<input name="montant" id="v-capital" inputmode="decimal"></label>
<button type="submit">Calculer</button></form></div>
<div class="carte"><h2>Surebet</h2>
<form method="post" action="/outils" style="display:grid;gap:10px">
<input type="hidden" name="outil" value="surebet">
<label>Cotes couvrant toutes les issues (séparées par des espaces)<input name="cotes" id="s-cotes" placeholder="5,00 1,30" required></label>
<label>Montant total<input name="montant" id="s-total" inputmode="decimal" value="100"></label>
<button type="submit">Calculer</button></form></div>
<div class="carte"><h2>Promotions 22bet</h2>
<form method="post" action="/outils" style="display:grid;gap:10px">
<label>Type<select name="outil" id="p-type"><option value="gratuit">Pari gratuit</option><option value="cashback">Remboursé si perdu</option><option value="boost">Cote boostée</option></select></label>
<label>Probabilité juste (%)<input name="proba" id="p-proba" inputmode="decimal" required></label>
<label>Cote<input name="cote_saisie" id="p-cote" inputmode="decimal" required></label>
<label>Montant du pari<input name="montant" id="p-montant" inputmode="decimal" required></label>
<label>Part remboursée (%, cashback)<input name="taux" id="p-taux" inputmode="decimal" value="50"></label>
<button type="submit">Calculer</button></form></div>
</div>
{% endblock %}
