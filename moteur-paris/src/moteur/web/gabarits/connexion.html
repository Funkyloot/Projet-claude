{% extends "base.html" %}
{% block titre %}Connexion · Moteur de paris{% endblock %}
{% block contenu %}
<div class="carte" style="max-width:420px;margin:40px auto;display:grid;gap:14px">
<h1>Moteur de paris</h1>
{% if premiere %}
<p class="doux">Première visite : choisissez le mot de passe qui protégera l'interface (8 caractères au moins).</p>
<form method="post" action="/connexion" style="display:grid;gap:12px">
<label>Mot de passe<input type="password" name="mdp" id="mdp" required minlength="8" autocomplete="new-password"></label>
<label>Confirmation<input type="password" name="confirmation" id="confirmation" required minlength="8" autocomplete="new-password"></label>
<button type="submit">Créer et entrer</button>
</form>
{% else %}
<form method="post" action="/connexion" style="display:grid;gap:12px">
<label>Mot de passe<input type="password" name="mdp" id="mdp" required autofocus autocomplete="current-password"></label>
<button type="submit">Entrer</button>
</form>
{% endif %}
</div>
{% endblock %}
