:root {
  --nuit: #141022;
  --encre: #1f2a44;
  --encre-2: #2a3654;
  --creme: #fff6e0;
  --creme-2: #f1e6c8;
  --clair: #f4f1e8;
  --rouge: #c2504d;
  --rouge-vif: #e4432d;
  --jaune: #f2c14e;
  --bleu: #2f6fdb;
  --vert: #3fa34d;
  --gris: #8a94a6;
  --ok: #2e7d32;
  --ko: #b23b2e;
  --police: 'Jersey 10', ui-monospace, 'Courier New', monospace;
  --u: 1px;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--nuit);
  color: var(--clair);
  font-family: var(--police);
  font-synthesis: none;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

#cadre {
  position: relative;
  width: 320px;
  height: 568px;
  box-shadow: 0 0 0 calc(var(--u) * 2) #000, 0 calc(var(--u) * 8) calc(var(--u) * 30) rgba(0, 0, 0, 0.5);
}

#jeu {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}

#interface {
  position: absolute;
  inset: 0;
  font-size: calc(var(--u) * 14.5);
  line-height: 1.25;
  display: flex;
  flex-direction: column;
}
/* Caché = vraiment absent : sinon le calque vide avale les touchers de la course et de la ville. */
#interface[hidden] { display: none !important; }
#interface.fond-sombre { background: rgba(20, 16, 34, 0.84); }
#interface.plein { background: rgba(20, 16, 34, 0.9); }

/* --- Éléments communs ------------------------------------------------------- */

.ecran {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(var(--u) * 10);
  padding: calc(var(--u) * 14);
  min-height: 0;
}
.defile-ecran { justify-content: flex-start; overflow-y: auto; }
/* Tout écran peut défiler si son contenu dépasse (choix de couleur, aide…).
   Centré quand il y a la place (marges automatiques), sans rien couper en haut sinon. */
.ecran { overflow-y: auto; touch-action: pan-y; justify-content: flex-start; }
.ecran > * { flex: none; }
.ecran:not(.defile-ecran) > :first-child { margin-top: auto; }
.ecran:not(.defile-ecran) > :last-child { margin-bottom: auto; }

.pile { display: flex; flex-direction: column; gap: calc(var(--u) * 8); }

.btn {
  font-family: var(--police);
  font-synthesis: none;
  font-size: calc(var(--u) * 15.9);
  font-weight: 700;
  color: var(--encre);
  background: var(--creme);
  border: calc(var(--u) * 2) solid var(--encre);
  border-radius: calc(var(--u) * 5);
  box-shadow: 0 calc(var(--u) * 3) 0 var(--encre);
  min-height: calc(var(--u) * 30);
  padding: calc(var(--u) * 4) calc(var(--u) * 8);
  cursor: pointer;
  transition: transform 60ms;
}
.btn:active:not(:disabled) { transform: translateY(calc(var(--u) * 2)); box-shadow: 0 calc(var(--u) * 1) 0 var(--encre); }
.btn:focus-visible { outline: calc(var(--u) * 2) solid var(--jaune); outline-offset: calc(var(--u) * 2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-principal { background: var(--jaune); }
.btn-rouge { background: var(--rouge-vif); color: #fff; }
.btn-sombre { background: var(--encre-2); color: var(--clair); }
.btn-vert { background: var(--vert); color: #fff; }
.btn-mini { font-size: calc(var(--u) * 13); min-height: calc(var(--u) * 24); padding: calc(var(--u) * 2) calc(var(--u) * 6); box-shadow: 0 calc(var(--u) * 2) 0 var(--encre); }

.lien {
  font-family: var(--police);
  font-size: calc(var(--u) * 13);
  background: none;
  border: 0;
  color: var(--creme-2);
  text-decoration: underline;
  cursor: pointer;
  padding: calc(var(--u) * 2);
}

.panneau {
  background: var(--creme);
  color: var(--encre);
  border: calc(var(--u) * 2) solid var(--encre);
  border-radius: calc(var(--u) * 6);
  box-shadow: calc(var(--u) * 3) calc(var(--u) * 3) 0 rgba(0, 0, 0, 0.35);
  overflow: hidden;
}
.panneau.verrouille { background: #ddd8cb; color: #5b6170; }
.titre-panneau {
  margin: 0;
  background: var(--rouge-vif);
  color: #fff;
  font-size: calc(var(--u) * 15.9);
  padding: calc(var(--u) * 5) calc(var(--u) * 8);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1);
  text-wrap: balance;
}
.titre-panneau small { font-size: calc(var(--u) * 11.6); font-weight: 400; opacity: 0.9; }
.verrouille .titre-panneau { background: var(--gris); }
.contenu { padding: calc(var(--u) * 7) calc(var(--u) * 8); display: flex; flex-direction: column; gap: calc(var(--u) * 6); }
.texte p { margin: 0; }
.petit { font-size: calc(var(--u) * 11.6); color: #4a5068; }
.clair { color: var(--creme-2); }
.titre-section { margin: 0; font-size: calc(var(--u) * 20.3); color: var(--jaune); text-shadow: 0 calc(var(--u) * 2) 0 #000; }

.ligne { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 6); flex-wrap: wrap; }
.ligne > .stat { flex: 1; min-width: 0; }

.stat { display: grid; grid-template-columns: calc(var(--u) * 46) 1fr calc(var(--u) * 16); align-items: center; gap: calc(var(--u) * 4); font-size: calc(var(--u) * 12.3); }
.stat b { text-align: right; font-variant-numeric: tabular-nums; }
.jauge { height: calc(var(--u) * 6); background: #e6dcc4; border: calc(var(--u) * 1) solid var(--encre); }
.jauge i { display: block; height: 100%; }

/* --- Barre du haut (jour, argent, licence) ---------------------------------- */

.barre {
  background: var(--encre);
  border-bottom: calc(var(--u) * 3) solid #0f172a;
  padding: calc(var(--u) * 6) calc(var(--u) * 8);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 5);
}
.barre-ligne { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 4); }
.jour { font-size: calc(var(--u) * 14.5); letter-spacing: calc(var(--u) * 1); }
.argent { color: var(--jaune); font-weight: 700; font-size: calc(var(--u) * 15.9); font-variant-numeric: tabular-nums; background: #0f172a; padding: calc(var(--u) * 2) calc(var(--u) * 6); border-radius: calc(var(--u) * 4); }
.pastilles { justify-content: flex-start; flex-wrap: wrap; }
.pastille { font-size: calc(var(--u) * 11.6); padding: calc(var(--u) * 1) calc(var(--u) * 5); border-radius: calc(var(--u) * 3); color: #fff; }
.pastille.bleu { background: var(--bleu); }
.pastille.rouge { background: var(--rouge-vif); }
.pastille.sombre { background: #3a4a6b; }

/* --- Garage ----------------------------------------------------------------- */

#interface.garage { justify-content: space-between; }
.bas { display: flex; flex-direction: column; gap: calc(var(--u) * 7); padding: calc(var(--u) * 8); background: linear-gradient(transparent, rgba(20, 16, 34, 0.85) 18%); }
.grille-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--u) * 6); }
.petits-liens { display: flex; justify-content: center; gap: calc(var(--u) * 10); }

.nouvelles {
  margin: calc(var(--u) * 6) calc(var(--u) * 8) 0;
  background: #fff;
  color: var(--encre);
  border: calc(var(--u) * 2) solid var(--encre);
  border-radius: calc(var(--u) * 6);
  box-shadow: calc(var(--u) * 3) calc(var(--u) * 3) 0 var(--encre);
  padding: calc(var(--u) * 6) calc(var(--u) * 8);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 5);
  cursor: pointer;
}
.nouvelle { display: flex; flex-direction: column; gap: calc(var(--u) * 1); font-size: calc(var(--u) * 13); }
.nouvelle b { color: var(--rouge-vif); }
.nouvelles small { font-size: calc(var(--u) * 10.2); color: var(--gris); text-align: right; }

.voiture-carte { padding: calc(var(--u) * 7) calc(var(--u) * 8); display: flex; flex-direction: column; gap: calc(var(--u) * 5); }
.voiture-entete { display: flex; justify-content: space-between; align-items: center; font-size: calc(var(--u) * 15.9); }
.classe { font-size: calc(var(--u) * 11.6); color: #fff; padding: calc(var(--u) * 2) calc(var(--u) * 5); border-radius: calc(var(--u) * 3); background: var(--gris); }
.classe-C { background: var(--bleu); }
.classe-B { background: #7a3fb0; }
.classe-A { background: var(--rouge-vif); }
.classe-S { background: #b7791f; }
.voiture-corps { display: flex; align-items: center; gap: calc(var(--u) * 8); }
.profil { width: calc(var(--u) * 66); height: auto; image-rendering: pixelated; flex: none; }
.stats { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 3); }

/* --- Listes défilantes (boutique, bureau) -------------------------------------- */

#interface.plein { justify-content: flex-start; }
.defile { flex: 1; min-height: 0; overflow-y: auto; padding: calc(var(--u) * 8); display: flex; flex-direction: column; gap: calc(var(--u) * 8); }
.defile > *, .defile-ecran > * { flex: none; }
.defile-ecran > .btn:last-child { position: sticky; bottom: 0; }
.pied { padding: calc(var(--u) * 8); background: rgba(20, 16, 34, 0.95); border-top: calc(var(--u) * 2) solid #0f172a; display: flex; flex-direction: column; }
.actions-ligne { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; padding-top: 0; }

.gp { border-bottom: calc(var(--u) * 1) dashed #c9bf9f; padding-bottom: calc(var(--u) * 6); display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
.gp:last-child { border-bottom: 0; padding-bottom: 0; }
.gp-tete { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 6); font-size: calc(var(--u) * 14.5); }

        const a = vs[i], b2 = vs[k];

        if (dx * dx + dy * dy > 54 * 54) continue;
        const c3 = recouvrement(a, b2);
        if (!c3) continue;
        const { nx, ny, prof } = c3;
        a.x -= nx * prof / 2;
        a.y -= ny * prof / 2;
        b2.x += nx * prof / 2;
        b2.y += ny * prof / 2;
        const rel = (b2.vx - a.vx) * nx + (b2.vy - a.vy) * ny;
        if (rel >= 0) continue;
        const imp = -rel * 0.6;

        a.vy -= ny * imp;

        b2.vy += ny * imp;

        b2.durabilite = Math.max(0, b2.durabilite - imp / 30);

        if (b2.joueur) a.dernierContact = this.temps;

          if (imp > 40) {

            this.etincelles(cx, cy, imp);

    /** Les deux poteaux du portique de départ sont solides. */
    poteauxPortique(v2) {

        const rx = p3.x - v2.x, ry = p3.y - v2.y;
        const u = clamp(rx * fx + ry * fy, -DEMI_LONGUEUR, DEMI_LONGUEUR);
        const w = clamp(-rx * fy + ry * fx, -DEMI_LARGEUR, DEMI_LARGEUR);
        const qx = v2.x + fx * u - fy * w, qy = v2.y + fy * u + fx * w;
        let nx = qx - p3.x, ny = qy - p3.y;

        if (d2 >= RAYON_POTEAU) continue;
        if (d2 < 1e-3) {
          nx = v2.x - p3.x;
          ny = v2.y - p3.y;
          d2 = Math.hypot(nx, ny) || 1;
          nx /= d2;
          ny /= d2;
          d2 = 0;
        } else {
          nx /= d2;
          ny /= d2;
        }
        const prof = RAYON_POTEAU - d2;
        v2.x += nx * prof;
        v2.y += ny * prof;
        const choc = -(v2.vx * nx + v2.vy * ny);

          v2.vy += ny * choc * 1.4;

          v2.vy *= 0.6;

    // --- Bonus sur la piste, drift, départ parfait -------------------------------

      const bonus = [];
      for (let s2 = 260; s2 < L - 160; s2 += 200 + alea() * 120) {

        if (alea() < 0.16) {
          const p3 = pointA(this.circuit, s2, voie);
          bonus.push({ type: "disque", x: p3.x, y: p3.y, pris: false });
        } else {
          for (let k = 0; k < 3; k++) {
            const p3 = pointA(this.circuit, s2 + k * 22, voie);

          this.son?.piece();

        this.driftEnCours += dt;
        return;
      }
      this.driftMax = Math.max(this.driftMax, this.driftEnCours);
      if (this.driftEnCours > 0.5) {
        const gain = Math.round(this.driftEnCours * 6);
        this.drift += gain;
        this.message(`DRIFT ! +${gain} EXP`, 1, "#c4b5fd", j);
        this.applaudir(j, 160);

      this.driftEnCours = 0;

    /** Appuyer pile au feu vert (ni trop tôt, ni trop tard) lance la voiture. */

        this.joueur.calage = 0.6;

        if (a.fini) return -1;

        return b2.progres - a.progres;

    // --- Effets ----------------------------------------------------------------
    effets(dt) {

        if (v2.nitro > 0 || v2.aura > 0) {
          const fx = Math.cos(v2.angle), fy = Math.sin(v2.angle);
          this.particules.push({
            x: v2.x - fx * 24 + (Math.random() - 0.5) * 6,
            y: v2.y - fy * 24 + (Math.random() - 0.5) * 6,
            vx: -fx * 40 + (Math.random() - 0.5) * 20,
            vy: -fy * 40 + (Math.random() - 0.5) * 20,
            vie: 0.3,
            max: 0.3,
            couleur: v2.aura > 0 ? "#f472b6" : Math.random() < 0.5 ? "#ff8a00" : "#ffe066",
            taille: 2
          });
        }
        if (v2.horsPiste > 0.4 && v2.vitesse > 60 && Math.random() < 0.5) {
          this.particules.push({ x: v2.x, y: v2.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, vie: 0.5, max: 0.5, couleur: "#c9bf96", taille: 3 });
        }
        if (v2.tete > 0 && Math.random() < 0.6) {
          this.particules.push({ x: v2.x, y: v2.y, vx: (Math.random() - 0.5) * 30, vy: -10 - Math.random() * 20, vie: 0.7, max: 0.7, couleur: "#9aa0b5", taille: 4 });

        }

    message(texte2, duree, couleur, ancre = null) {

        driftMax: this.driftMax,

  var BUDGET_RARETE = { commune: 0, rare: 6, super: 12, legendaire: 18 };

  function p2(id, nom, emplacement, rarete, niveau, poids, extra = {}) {
    const budget = (8 + 3.5 * niveau + BUDGET_RARETE[rarete]) * FACTEUR[emplacement];
    const total = Object.values(poids).reduce((a, b2) => a + Math.max(0, b2), 0) || 1;
    const bonus = {};
    for (const [k, w] of Object.entries(poids)) bonus[k] = Math.round(budget * w / total);
    const prix2 = Math.round(2e3 * 1.45 ** niveau * PRIX_RARETE[rarete] / 100) * 100;
    return { id, nom, emplacement, rarete, prix: prix2, recherche: niveau, bonus, ...extra };
  }

        this.annonce(`${d2.nom} : ${d2.etapes.length} points en ${limite} s !`, "#ffe066");
      } else if (d2.type === "livraison") {
        const liste = d2.vers === "ferme" ? this.fermes : this.maisons;

        const dist = Math.abs(dest.x - d2.x) + Math.abs(dest.y - d2.y);
        const limite = Math.round(dist / 100 + 8);
        this.defi = { d: d2, type: "livraison", t: 0, limite, cible: dest, intact: 1 };

    chocs(v2) {

          v2.y += c3.ny * c3.prof;
          this.contact = true;
          const choc = -(v2.vx * c3.nx + v2.vy * c3.ny);

        const c3 = recouvrement(v2, t);
        if (!c3) continue;
        v2.x -= c3.nx * c3.prof;
        v2.y -= c3.ny * c3.prof;

        const choc = v2.vx * c3.nx + v2.vy * c3.ny;

        v2.vy -= c3.ny * choc * 1.4;

        v2.vy *= 0.7;

    surveillerFeux(v2) {

      v2.vy = 0;

    // --- Dessin --------------------------------------------------------------------
    // --- Peinture par morceaux -------------------------------------------------------
    /** Le morceau (i, j) de la carte, peint à la demande et gardé en cache. */
    morceau(i, j) {
      const cle = i * 100 + j;
      let m = this.morceaux.get(cle);
      if (m) {
        this.morceaux.delete(cle);
        this.morceaux.set(cle, m);
        return m;
      }
      if (!this.statiquesTries) {
        this.statiques.sort((a, b2) => a.y - b2.y);
        this.statiquesTries = true;
      }
      m = this.recycles?.pop() || document.createElement("canvas");
      m.width = MORCEAU;
      m.height = MORCEAU;
      const c3 = m.getContext("2d");

    /** Peint d'avance, un par image, les morceaux autour de la caméra (pas d'à-coup en roulant). */
    prechauffer(camX, camY, W3, H3) {

      for (let j = Math.floor((camY - marge) / MORCEAU); j <= Math.floor((camY + H3 + marge) / MORCEAU); j++) {
        for (let i = Math.floor((camX - marge) / MORCEAU); i <= Math.floor((camX + W3 + marge) / MORCEAU); i++) {

    /** Sol : pelouse, routes (bitume), trottoirs en ville, bas-côtés d'herbe à la campagne. */
    peindreSol(c3, x0, y0, x1, y1) {
      c3.fillStyle = "#84c669";
      c3.fillRect(x0, y0, x1 - x0, y1 - y0);
      const R = RESEAU;
      for (let gy = Math.max(0, Math.floor(y0 / T)); gy < Math.min(R.cases, Math.ceil(y1 / T)); gy++) {
        for (let gx = Math.max(0, Math.floor(x0 / T)); gx < Math.min(R.cases, Math.ceil(x1 / T)); gx++) {
          const k = R.classer(gx, gy);
          if (!k || k.type === "terre") continue;
          const x = gx * T, y = gy * T;
          if (k.type === "route") {
            c3.fillStyle = "#52607c";
            c3.fillRect(x, y, T, T);
            continue;
          }
          if (estUrbain(k.bx, k.by)) {
            c3.fillStyle = "#d4d9e3";
            c3.fillRect(x, y, T, T);
            c3.fillStyle = "#c4cad6";
            c3.fillRect(x + T - 1, y, 1, T);
            c3.fillRect(x, y + T - 1, T, 1);
            c3.fillStyle = "#8b9bb4";
            if (k.gauche) c3.fillRect(x, y, 2, T);
            if (k.droite) c3.fillRect(x + T - 2, y, 2, T);
            if (k.haut) c3.fillRect(x, y, T, 2);
            if (k.bas) c3.fillRect(x, y + T - 2, T, 2);
          } else {
            c3.fillStyle = "#76b35d";
            c3.fillRect(x, y, T, T);
            c3.fillStyle = "#d9a46e";
            if (k.gauche) c3.fillRect(x, y, 3, T);
            if (k.droite) c3.fillRect(x + T - 3, y, 3, T);
            if (k.haut) c3.fillRect(x, y, T, 3);
            if (k.bas) c3.fillRect(x, y + T - 3, T, 3);
          }
        }
      }
    }
    /** Marquages : lignes, terre-pleins, passages piétons, lignes de STOP ; zones d'entrée. */
    peindreRoutesDessus(c3, x0, y0, x1, y1) {
      const R = RESEAU;
      for (let k = 0; k <= R.N; k++) for (let s2 = 0; s2 < R.N; s2++) {
        for (const horizontal of [true, false]) {
          if (!(horizontal ? R.H[k][s2] : R.V[k][s2])) continue;
          const a = R.X[s2] + R.L[s2], l = R.X[s2 + 1] - a, b2 = R.X[k], w = R.L[k];
          const box = horizontal ? { x: a, y: b2, w: l, h: w } : { x: b2, y: a, w, h: l };
          if (box.x > x1 || box.x + box.w < x0 || box.y > y1 || box.y + box.h < y0) continue;
          const ville = horizontal ? estUrbain(s2, k - 1) || estUrbain(s2, k) : estUrbain(k - 1, s2) || estUrbain(k, s2);

        if (q.x > x1 + 40 || q.x + q.w < x0 - 40 || q.y > y1 + 40 || q.y + q.h < y0 - 40) continue;
        const [e3, su, o3, no] = R.branches(kx, ky);
        c3.fillStyle = "#f4f6fb";
        if (carrefourUrbain(kx, ky)) {
          for (let i = 4; i < q.w - 4; i += 12) {

      clearTimeout(this.toastMinuteur);
      this.toastMinuteur = setTimeout(() => {
        this.toastEl.hidden = true;
      }, 2200);
    }
    sauver() {
      for (const o3 of verifierObjectifs(this.partie)) this.annoncerObjectif(o3);
      sauver(this.partie);
      this.partieSauvee = this.partie;
      ecrire(this.partie);
    }
    /** Bandeau « Objectif atteint » en haut de l'écran, sans bloquer le jeu. */
    annoncerObjectif(o3) {
      this.fileObjectifs = this.fileObjectifs || [];
      this.fileObjectifs.push(o3);
      if (this.fileObjectifs.length > 1) return;
      const suivant = () => {
        const x = this.fileObjectifs[0];
        if (!x) return;
        const el = document.getElementById("objectif");
        el.innerHTML = `<small>OBJECTIF ATTEINT !</small><b>${x.titre.replace(/</g, "&lt;")}</b><span>${texteRecompense(x.recompense)}</span>`;
        el.hidden = false;
        el.classList.remove("entre");
        void el.offsetWidth;
        el.classList.add("entre");
        this.son.niveau();
        setTimeout(() => {
          el.hidden = true;
          this.fileObjectifs.shift();
          suivant();
        }, 2600);
      };
      suivant();
    }
    titre() {
      this.ecran = "titre";
      this.scene.placement = null;
      this.scene.selection = null;
      this.montrer(ecranTitre(this));
    }
    nouvellePartie() {
      this.partie = nouvellePartie();
      this.son.actif = this.partie.son;
      this.sauver();
      this.cadeauPuis(() => this.garage());
    }
    continuer() {
      this.partie = this.partieSauvee;
      this.cadeauPuis(() => {
        if (this.partie.gp) {
          this.briefing(this.partie.gp.id, true);
          return;
        }
        this.garage();
      });
    }
    /** Cadeau du jour (vrai calendrier), puis la suite. */
    cadeauPuis(suite) {
      const c3 = cadeauDuJour(this.partie);
      if (!c3) {
        suite();
        return;
      }
      this.sauver();
      this.ecran = "garage";
      this.montrer(ecranCadeau(this, c3, suite));
    }
    garage() {
      this.ecran = "garage";
      this.course = null;
      this.ville = null;
      this.scene.placement = null;
      if (this.partie.ceremonie) {
        const c3 = this.partie.ceremonie;
        this.montrer(ecranCeremonie(this, c3, () => {
          const rangs = recevoirCeremonie(this.partie);
          this.sauver();
          this.apresRangs(rangs, () => this.garage());
        }));
        return;
      }
      if (this.partie.finCarriere) {
        const r = terminerCarriere(this.partie);
        this.sauver();
        this.montrer(ecranFinCarriere(this, r, {
          plus: () => {
            this.partie = nouvellePartiePlus(this.partie);
            this.sauver();
            this.garage();
          },
          continuer: () => this.garage()
        }));
        return;
      }
      this.montrer(ecranGarage(this));
    }
    /** Actions de gestion : renvoie vrai si elles ont réussi, puis sauvegarde. */
    action(nom, arg) {
      const f = {
        acheter,
        ameliorer,
        reparer,
        peindre,
        inscrire,
        candidater: deposerCandidature,
        acheterPiece: (p3, [id, remise]) => acheterPiece(p3, id, remise),
        monter,
        demonter,
        vendrePiece,
        rechercher,
        tirerTombola,
        boireCafe,
        signerSponsor,
        agrandirTerrain,
        ameliorerBatiment,
        vendreBatiment,
        affecter: (p3, [s2, b2]) => affecter(p3, s2, b2),
        recruter,
        embaucher,
        licencier,
        former,
        ameliorerPiece,
        entrainerPilote: entrainer,
        recruterPilotes,
        engagerPilote,
        renvoyerPilote,
        choisirTitulaire,
        choisirSecond,
        choisirVoitureSecond
      }[nom];
      const ok = f(this.partie, arg);
      if (ok) this.sauver();
      return ok;
    }
    jourSuivant() {
      const nouvelles = jourSuivant(this.partie);
      this.sauver();
      this.garage();
      if (!nouvelles.length) this.toast(`Jour ${this.partie.jour} : rien de neuf au garage.`);
    }
    /** Enchaîne les écrans de montée de rang, puis `suite`. */
    apresRangs(rangs, suite) {
      if (!rangs || !rangs.length) {
        suite();
        return;
      }
      const [m, ...reste] = rangs;
      this.sauver();
      this.son.niveau();
      this.montrer(ecranRang(this, m, () => this.apresRangs(reste, suite)));
    }
    /** Construction : la voiture apparaît sur le pont pendant l'animation, puis on passe au lendemain. */
    construireVoiture(idModele, couleur, enVille) {
      const r = construire(this.partie, idModele, couleur);
      if (!r) return;
      this.son.caisse();
      this.sauver();
      const brute = this.partie.garage.find((g) => g.uid === r.uid);
      const v2 = decrireVoiture(this.partie, brute);
      if (enVille) {
        this.ville = null;
      }
      this.ecran = "garage";
      this.scene.construire(v2, 5.4);
      this.montrer(ecranConstruction(this, v2, () => {
        this.scene.finConstruction();
        const nouvelles = jourSuivant(this.partie);
        this.partie.nouvelles = [{ titre: "Voiture termin\xE9e", texte: `${v2.nom} sort de l'atelier. Une journ\xE9e de travail !` }, ...nouvelles];
        this.sauver();
        this.garage();
      }));
    }
    // --- Ville -------------------------------------------------------------------------
    sortirEnVille() {
      if (!peutSortir(this.partie)) return;
      const v2 = voitureActive(this.partie);
      if (!v2) return;
      this.ville = new Ville({ planche: this.assets.urbain, tiny: this.assets.tiny, voiture: v2, son: this.son, graine: this.partie.jour * 101 + 7, memoire: this.partie.memoireVille });
      this.villeFinie = false;
      this.pause = false;
      this.accu = 0;
      this.pointeurs.clear();
      this.touches.clear();
      this.ecran = "ville";
      this.ui.vider();
      this.toast("Gare-toi sur une zone jaune pour entrer.");
    }
    entrerBatiment(porte) {
      const retour = () => {
        this.ville.sortir();
        this.pointeurs.clear();
        this.touches.clear();
        this.ui.vider();
      };
      this.pointeurs.clear();
      const ecrans = {
        garage: () => {
          this.ville.temps = Math.max(this.ville.temps, 1e9);
          this.ville.entree = null;
          this.ville.fini = true;
          return null;
        },
        bureau: () => ecranBureau(this, retour),
        concession: () => ecranBoutique(this, retour, true),
        pieces: () => ecranPieces(this, { enVille: true, retour }),
        tombola: () => ecranTombola(this, retour),
        cafe: () => ecranCafe(this, retour)
      };
      const ecran = ecrans[porte.id]();
      if (ecran) this.montrer(ecran);
    }
    finBalade() {
      this.villeFinie = true;
      const g = this.ville.bilan();
      const rangs = finBalade(this.partie, g);
      this.sauver();
      this.son.fanfare();
      this.montrer(ecranFinBalade(this, g, () => this.apresRangs(rangs, () => this.garage())));
    }
    briefing(gpId, reprise = false) {
      if (this.ville && !this.villeFinie) {
        this.villeFinie = true;
        finBalade(this.partie, this.ville.bilan());
      }
      this.ville = null;
      if (!peutCourir(this.partie)) {
        this.toast("Une seule course par soir : la prochaine, c\u2019est demain soir.");
        this.garage();
        return;
      }
      if (!(this.partie.gp && this.partie.gp.id === gpId)) commencerGP(this.partie, gpId);
      this.sauver();
      const gp = grandPrix(gpId);
      const manche = this.partie.gp.manche;
      const def = gp.manches[manche];
      this.circuit = genererCircuit(def, gp.niveau <= 2 ? 120 : 108);
      const apercu = miniCarte(this.circuit, 150, 150).canvas.toDataURL();
      this.ecran = "briefing";
      this.montrer(ecranBriefing(this, gp, manche, apercu));
    }
    depart() {
      this.montrer(ecranChargement("Pr\xE9paration du circuit\u2026"));
      setTimeout(() => this.lancerCourse(), 30);
    }
    lancerCourse() {
      const gp = grandPrix(this.partie.gp.id);
      const def = gp.manches[this.partie.gp.manche];
      const decor = rendreCircuit(this.circuit, this.assets.urbain, gp.niveau, this.assets.tiny);
      const v2 = voitureActive(this.partie);
      const eng = engagement(this.partie);
      this.adversaires = adversaires(gp, this.partie.gp.manche);
      let coequipier = null;
      if (eng.second) {
        const v22 = decrireVoiture(this.partie, eng.voitureSecond, eng.second);
        coequipier = {
          physique: v22.physique,
          couleur: v22.couleur,
          looks: v22.looks,
          nom: eng.second.nom,
          surfaces: v22.surfaces,
          modele: modeleVoiture(v22.profil, v22.id),
          talent: talentPilote(eng.second) * 0.5,
          usure: eng.voitureSecond.usure
        };
      }
      this.course = new Course({
        circuit: this.circuit,
        decor,
        planche: this.assets.urbain,
        tiny: this.assets.tiny,
        tours: def.tours,
        joueur: {
          physique: v2.physique,
          couleur: v2.couleur,
          looks: v2.looks,
          modele: modeleVoiture(v2.profil, v2.id),
          pilote: eng.titulaire?.nom || "Pilote",
          tenue: tenuePilote(eng.titulaire),
          nitros: v2.nitros,
          nitroDuree: v2.nitroDuree,
          surfaces: v2.surfaces
        },
        adversaires: this.adversaires,
        coequipier,
        aide: this.partie.aide,
        son: this.son,
        niveau: gp.niveau
      });
      this.course.joueur.durabilite = v2.physique.durabiliteMax * (1 - v2.usure);
      if (this.course.coequipier) this.course.coequipier.durabilite = coequipier.physique.durabiliteMax * (1 - coequipier.usure);
      this.pause = false;
      this.accu = 0;
      this.pointeurs.clear();
      this.touches.clear();
      this.ecran = "course";
      this.ui.vider();
    }
    basculerPause() {
      if (!this.course) return;
      if (this.pause) {
        this.reprendre();
        return;
      }
      this.pause = true;
      this.montrer(ecranPause(this));
    }
    reprendre() {
      this.pause = false;
      this.pointeurs.clear();
      this.ui.vider();
    }
    abandonnerCourse() {
      this.pause = false;
      const c3 = this.course;
      c3.joueur.progres = -1e9;
      c3.joueur.fini = false;
      c3.joueur.tempsArrivee = Infinity;
      this.finManche(true);
    }
    finManche(abandon = false) {
      const c3 = this.course;
      if (!c3 || this.ecran !== "course") return;
      this.ecran = "resultats";
      const gp = grandPrix(this.partie.gp.id);
      const noms = this.noms();
      let res = c3.resultats();
      if (abandon) {
        res = res.filter((r) => !r.voiture.joueur).concat(res.filter((r) => r.voiture.joueur));
        res.forEach((r, i) => {
          r.place = i + 1;
        });
      }
      const resultats = res.map((r) => {
        const id = r.voiture.joueur ? "joueur" : r.voiture.equipe;
        return { id, ...noms[id], place: r.place, temps: r.temps, ecart: r.ecart };
      });
      const gain = enregistrerManche(this.partie, resultats, c3.bilan());
      this.sauver();
      const general = classementGP(this.partie, noms);
      this.montrer(ecranResultats(this, { gp, manche: this.partie.gp.manche, resultats, general, gain, depassements: c3.depassements, drift: c3.drift }));
    }
    noms() {
      const eng = engagement(this.partie);
      const noms = {
        joueur: { nom: eng.titulaire?.nom || "Pilote", ecurie: "Garage Piston", couleur: voitureActive(this.partie)?.couleur || "#f2c14e" },
        coequipier: { nom: eng.second?.nom || "Second pilote", ecurie: "Garage Piston", couleur: eng.voitureSecond?.couleur || "#f2c14e" }
      };
      const gp = this.partie.gp && grandPrix(this.partie.gp.id);
      for (const a of gp ? adversaires(gp) : this.adversaires || []) noms[a.equipe] = { nom: a.nom, ecurie: a.ecurie, couleur: a.couleur };
      return noms;
    }
    /** Après une manche (pas la dernière) : la soirée est finie, on passe au lendemain matin. */
    mancheSuivante() {
      this.course = null;
      const gp = grandPrix(this.partie.gp.id);
      jourSuivant(this.partie);
      this.partie.nouvelles.unshift({ titre: gp.nom, texte: `Manche ${this.partie.gp.manche + 1} sur ${gp.manches.length} : ce soir ! Pr\xE9pare la voiture dans la journ\xE9e.` });
      this.sauver();
      this.garage();
    }
    /** Bouton du garage : courir la manche suivante du Grand Prix en cours. */
    courirCeSoir() {
      if (!this.partie.gp) return;
      this.briefing(this.partie.gp.id, true);
    }
    finGP() {
      const gp = grandPrix(this.partie.gp.id);
      const general = classementGP(this.partie, this.noms());
      const place = general.findIndex((x) => x.id === "joueur" || x.id === "coequipier") + 1;
      const { gains, fans } = this.partie.gp;
      terminerGP(this.partie, place);
      this.sauver();
      this.course = null;
      this.ecran = "fin";
      if (place === 1) this.son.fanfare();
      this.montrer(ecranFinGP(this, { gp, general, place, gains, fans }));
    }
    // --- Garage : terrain, construction, personnel -------------------------------------
    toucherGarage(pt) {
      const sc = this.scene;
      if (sc.placement) {
        const c3 = sc.caseA(this.partie, pt.x, pt.y);
        if (!c3) return;
        const d2 = batiment(sc.placement.id);
        sc.placement.x = Math.max(0, Math.min(COLONNES_TERRAIN - d2.l, c3.x - Math.floor((d2.l - 1) / 2)));
        sc.placement.y = Math.max(0, Math.min(this.partie.terrain.lignes - d2.h, c3.y - Math.floor((d2.h - 1) / 2)));
        this.montrer(ecranPlacement(this, sc.placement, raisonPlacement(this.partie, sc.placement.id, sc.placement.x, sc.placement.y, sc.placement.sauf)));
        return;
      }
      const b2 = sc.batimentA(this.partie, pt.x, pt.y);
      if (b2) {
        sc.selection = b2.uid;
        this.son.clic();
        this.montrer(ecranFicheBatiment(this, b2.uid));
      } else if (sc.selection) {
        sc.selection = null;
        this.garage();
      }
    }
    modePlacement(pl) {
      this.ecran = "garage";
      this.scene.selection = null;
      this.scene.placement = { ...pl };
      this.montrer(ecranPlacement(this, this.scene.placement, null));
    }
    annulerPlacement() {
      const sauf = this.scene.placement?.sauf;
      this.scene.placement = null;
      if (sauf) {
        this.scene.selection = sauf;
        this.montrer(ecranFicheBatiment(this, sauf));
        return;
      }
      this.montrer(ecranConstruire(this));
    }
    validerPlacement() {
      const pl = this.scene.placement;
      if (!pl || pl.x === void 0) return;
      const r = pl.sauf ? deplacerBatiment(this.partie, pl.sauf, pl.x, pl.y) : construireBatiment(this.partie, pl.id, pl.x, pl.y);
      if (!r) {
        this.toast("Impossible ici.");
        return;
      }
      this.scene.placement = null;
      this.son.caisse();
      this.sauver();
      const suite = () => {
        this.scene.selection = r.batiment.uid;
        this.montrer(ecranFicheBatiment(this, r.batiment.uid));
      };
      const annoncer = (liste) => {
        if (!liste.length) {
          suite();
          return;
        }
        const [c3, ...reste] = liste;
        this.son.niveau();
        this.montrer(ecranCelebration(this, `COMBO : ${c3.nom} !`, c3.texte, () => annoncer(reste)));
      };
      annoncer(r.combos);
    }
    annulerGP() {
      this.partie.gp = null;
      this.sauver();
      this.montrer(ecranGarage(this));
      this.ecran = "garage";
    }
    abandonnerGP() {
      this.partie.gp = null;
      this.sauver();
      this.garage();
    }
  };
  var app = new App();
  app.demarrer();
  window.pistonville = app;
})();

</script>
