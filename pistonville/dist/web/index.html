:root {
  --nuit: #141022;
  --encre: #1f2a44;
  --encre-2: #2a3654;
  --creme: #fff6e0;
  --creme-2: #f1e6c8;
  --clair: #f4f1e8;
  --rouge: #c2504d;
  --rouge-vif: #e4432d;
  --jaune: #f2c14e;
  --bleu: #2f6fdb;
  --vert: #3fa34d;
  --gris: #8a94a6;
  --ok: #2e7d32;
  --ko: #b23b2e;
  --police: 'Jersey 10', ui-monospace, 'Courier New', monospace;
  --u: 1px;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--nuit);
  color: var(--clair);
  font-family: var(--police);
  font-synthesis: none;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

#cadre {
  position: relative;
  width: 320px;
  height: 568px;
  box-shadow: 0 0 0 calc(var(--u) * 2) #000, 0 calc(var(--u) * 8) calc(var(--u) * 30) rgba(0, 0, 0, 0.5);
}

#jeu {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}

#interface {
  position: absolute;
  inset: 0;
  font-size: calc(var(--u) * 14.5);
  line-height: 1.25;
  display: flex;
  flex-direction: column;
}
/* Caché = vraiment absent : sinon le calque vide avale les touchers de la course et de la ville. */
#interface[hidden] { display: none !important; }
#interface.fond-sombre { background: rgba(20, 16, 34, 0.84); }
#interface.plein { background: rgba(20, 16, 34, 0.9); }

/* --- Éléments communs ------------------------------------------------------- */

.ecran {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(var(--u) * 10);
  padding: calc(var(--u) * 14);
  min-height: 0;
}
.defile-ecran { justify-content: flex-start; overflow-y: auto; }
/* Tout écran peut défiler si son contenu dépasse (choix de couleur, aide…).
   Centré quand il y a la place (marges automatiques), sans rien couper en haut sinon. */
.ecran { overflow-y: auto; touch-action: pan-y; justify-content: flex-start; }
.ecran > * { flex: none; }
.ecran:not(.defile-ecran) > :first-child { margin-top: auto; }
.ecran:not(.defile-ecran) > :last-child { margin-bottom: auto; }

.pile { display: flex; flex-direction: column; gap: calc(var(--u) * 8); }

.btn {
  font-family: var(--police);
  font-synthesis: none;
  font-size: calc(var(--u) * 15.9);
  font-weight: 700;
  color: var(--encre);
  background: var(--creme);
  border: calc(var(--u) * 2) solid var(--encre);
  border-radius: calc(var(--u) * 5);
  box-shadow: 0 calc(var(--u) * 3) 0 var(--encre);
  min-height: calc(var(--u) * 30);
  padding: calc(var(--u) * 4) calc(var(--u) * 8);
  cursor: pointer;
  transition: transform 60ms;
}
.btn:active:not(:disabled) { transform: translateY(calc(var(--u) * 2)); box-shadow: 0 calc(var(--u) * 1) 0 var(--encre); }
.btn:focus-visible { outline: calc(var(--u) * 2) solid var(--jaune); outline-offset: calc(var(--u) * 2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-principal { background: var(--jaune); }
.btn-rouge { background: var(--rouge-vif); color: #fff; }
.btn-sombre { background: var(--encre-2); color: var(--clair); }
.btn-vert { background: var(--vert); color: #fff; }
.btn-mini { font-size: calc(var(--u) * 13); min-height: calc(var(--u) * 24); padding: calc(var(--u) * 2) calc(var(--u) * 6); box-shadow: 0 calc(var(--u) * 2) 0 var(--encre); }

.lien {
  font-family: var(--police);
  font-size: calc(var(--u) * 13);
  background: none;
  border: 0;
  color: var(--creme-2);
  text-decoration: underline;
  cursor: pointer;
  padding: calc(var(--u) * 2);
}

.panneau {
  background: var(--creme);
  color: var(--encre);
  border: calc(var(--u) * 2) solid var(--encre);
  border-radius: calc(var(--u) * 6);
  box-shadow: calc(var(--u) * 3) calc(var(--u) * 3) 0 rgba(0, 0, 0, 0.35);
  overflow: hidden;
}
.panneau.verrouille { background: #ddd8cb; color: #5b6170; }
.titre-panneau {
  margin: 0;
  background: var(--rouge-vif);
  color: #fff;
  font-size: calc(var(--u) * 15.9);
  padding: calc(var(--u) * 5) calc(var(--u) * 8);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1);
  text-wrap: balance;
}
.titre-panneau small { font-size: calc(var(--u) * 11.6); font-weight: 400; opacity: 0.9; }
.verrouille .titre-panneau { background: var(--gris); }
.contenu { padding: calc(var(--u) * 7) calc(var(--u) * 8); display: flex; flex-direction: column; gap: calc(var(--u) * 6); }
.texte p { margin: 0; }
.petit { font-size: calc(var(--u) * 11.6); color: #4a5068; }
.clair { color: var(--creme-2); }
.titre-section { margin: 0; font-size: calc(var(--u) * 20.3); color: var(--jaune); text-shadow: 0 calc(var(--u) * 2) 0 #000; }

.ligne { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 6); flex-wrap: wrap; }
.ligne > .stat { flex: 1; min-width: 0; }

.stat { display: grid; grid-template-columns: calc(var(--u) * 46) 1fr calc(var(--u) * 16); align-items: center; gap: calc(var(--u) * 4); font-size: calc(var(--u) * 12.3); }
.stat b { text-align: right; font-variant-numeric: tabular-nums; }
.jauge { height: calc(var(--u) * 6); background: #e6dcc4; border: calc(var(--u) * 1) solid var(--encre); }
.jauge i { display: block; height: 100%; }

/* --- Barre du haut (jour, argent, licence) ---------------------------------- */

.barre {
  background: var(--encre);
  border-bottom: calc(var(--u) * 3) solid #0f172a;
  padding: calc(var(--u) * 6) calc(var(--u) * 8);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 5);
}
.barre-ligne { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 4); }
.jour { font-size: calc(var(--u) * 14.5); letter-spacing: calc(var(--u) * 1); }
.argent { color: var(--jaune); font-weight: 700; font-size: calc(var(--u) * 15.9); font-variant-numeric: tabular-nums; background: #0f172a; padding: calc(var(--u) * 2) calc(var(--u) * 6); border-radius: calc(var(--u) * 4); }
.pastilles { justify-content: flex-start; flex-wrap: wrap; }
.pastille { font-size: calc(var(--u) * 11.6); padding: calc(var(--u) * 1) calc(var(--u) * 5); border-radius: calc(var(--u) * 3); color: #fff; }
.pastille.bleu { background: var(--bleu); }
.pastille.rouge { background: var(--rouge-vif); }
.pastille.sombre { background: #3a4a6b; }

/* --- Garage ----------------------------------------------------------------- */

#interface.garage { justify-content: space-between; }
.bas { display: flex; flex-direction: column; gap: calc(var(--u) * 7); padding: calc(var(--u) * 8); background: linear-gradient(transparent, rgba(20, 16, 34, 0.85) 18%); }
.grille-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--u) * 6); }
.petits-liens { display: flex; justify-content: center; gap: calc(var(--u) * 10); }

.nouvelles {
  margin: calc(var(--u) * 6) calc(var(--u) * 8) 0;
  background: #fff;
  color: var(--encre);
  border: calc(var(--u) * 2) solid var(--encre);
  border-radius: calc(var(--u) * 6);
  box-shadow: calc(var(--u) * 3) calc(var(--u) * 3) 0 var(--encre);
  padding: calc(var(--u) * 6) calc(var(--u) * 8);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 5);
  cursor: pointer;
}
.nouvelle { display: flex; flex-direction: column; gap: calc(var(--u) * 1); font-size: calc(var(--u) * 13); }
.nouvelle b { color: var(--rouge-vif); }
.nouvelles small { font-size: calc(var(--u) * 10.2); color: var(--gris); text-align: right; }

.voiture-carte { padding: calc(var(--u) * 7) calc(var(--u) * 8); display: flex; flex-direction: column; gap: calc(var(--u) * 5); }
.voiture-entete { display: flex; justify-content: space-between; align-items: center; font-size: calc(var(--u) * 15.9); }
.classe { font-size: calc(var(--u) * 11.6); color: #fff; padding: calc(var(--u) * 2) calc(var(--u) * 5); border-radius: calc(var(--u) * 3); background: var(--gris); }
.classe-C { background: var(--bleu); }
.classe-B { background: #7a3fb0; }
.classe-A { background: var(--rouge-vif); }
.classe-S { background: #b7791f; }
.voiture-corps { display: flex; align-items: center; gap: calc(var(--u) * 8); }
.profil { width: calc(var(--u) * 66); height: auto; image-rendering: pixelated; flex: none; }
.stats { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 3); }

/* --- Listes défilantes (boutique, bureau) -------------------------------------- */

#interface.plein { justify-content: flex-start; }
.defile { flex: 1; min-height: 0; overflow-y: auto; padding: calc(var(--u) * 8); display: flex; flex-direction: column; gap: calc(var(--u) * 8); }
.defile > *, .defile-ecran > * { flex: none; }
.defile-ecran > .btn:last-child { position: sticky; bottom: 0; }
.pied { padding: calc(var(--u) * 8); background: rgba(20, 16, 34, 0.95); border-top: calc(var(--u) * 2) solid #0f172a; display: flex; flex-direction: column; }
.actions-ligne { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; padding-top: 0; }

.gp { border-bottom: calc(var(--u) * 1) dashed #c9bf9f; padding-bottom: calc(var(--u) * 6); display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
.gp:last-child { border-bottom: 0; padding-bottom: 0; }
.gp-tete { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 6); font-size: calc(var(--u) * 14.5); }

    for (let k = 3; k >= 1; k--) {

      ctx.rotate(angle);
      ctx.scale(echelle, echelle);
      ctx.drawImage(flanc, -cx, -cy);
      ctx.restore();

    ctx.rotate(angle);

  var BUDGET_RARETE = { commune: 0, rare: 6, super: 12, legendaire: 18 };
  var PRIX_RARETE = { commune: 1, rare: 1.8, super: 3.2, legendaire: 6 };
  var FACTEUR = { moteur: 1, boite: 0.75, aileron: 0.75, chassis: 0.8, pneus: 0.55, nitro: 0.25 };
  function p2(id, nom, emplacement, rarete, niveau, poids, extra = {}) {
    const budget = (8 + 3.5 * niveau + BUDGET_RARETE[rarete]) * FACTEUR[emplacement];
    const total = Object.values(poids).reduce((a, b2) => a + Math.max(0, b2), 0) || 1;
    const bonus = {};
    for (const [k, w] of Object.entries(poids)) bonus[k] = Math.round(budget * w / total);
    const prix = Math.round(2e3 * 1.45 ** niveau * PRIX_RARETE[rarete] / 100) * 100;
    return { id, nom, emplacement, rarete, prix, recherche: niveau, bonus, ...extra };

  var URL_API = "api/sauvegarde";
  var actif = typeof location !== "undefined" && /^https?:$/.test(location.protocol);
  var minuteur = null;
  var derniere = null;
  async function lire() {
    if (!actif) return null;
    try {
      const r = await fetch(URL_API, { cache: "no-store" });
      if (r.status === 404) return null;
      if (!r.ok) {
        actif = false;
        return null;
      }
      const p3 = await r.json();
      return p3 && Array.isArray(p3.garage) ? p3 : null;
    } catch {
      actif = false;
      return null;

      this.ecran = "fin";
      if (place === 1) this.son.fanfare();
      this.montrer(ecranFinGP(this, { gp, general, place, gains, fans }));
    }
    // --- Garage : terrain, construction, personnel -------------------------------------
    toucherGarage(pt) {
      const sc = this.scene;
      if (sc.placement) {
        const c3 = sc.caseA(this.partie, pt.x, pt.y);
        if (!c3) return;
        const d2 = batiment(sc.placement.id);
        sc.placement.x = Math.max(0, Math.min(COLONNES_TERRAIN - d2.l, c3.x - Math.floor((d2.l - 1) / 2)));
        sc.placement.y = Math.max(0, Math.min(this.partie.terrain.lignes - d2.h, c3.y - Math.floor((d2.h - 1) / 2)));
        this.montrer(ecranPlacement(this, sc.placement, raisonPlacement(this.partie, sc.placement.id, sc.placement.x, sc.placement.y, sc.placement.sauf)));
        return;
      }
      const b2 = sc.batimentA(this.partie, pt.x, pt.y);
      if (b2) {
        sc.selection = b2.uid;
        this.son.clic();
        this.montrer(ecranFicheBatiment(this, b2.uid));
      } else if (sc.selection) {
        sc.selection = null;
        this.garage();
      }
    }
    modePlacement(pl) {
      this.ecran = "garage";
      this.scene.selection = null;
      this.scene.placement = { ...pl };
      this.montrer(ecranPlacement(this, this.scene.placement, null));
    }
    annulerPlacement() {
      const sauf = this.scene.placement?.sauf;
      this.scene.placement = null;
      if (sauf) {
        this.scene.selection = sauf;
        this.montrer(ecranFicheBatiment(this, sauf));
        return;
      }
      this.montrer(ecranConstruire(this));
    }
    validerPlacement() {
      const pl = this.scene.placement;
      if (!pl || pl.x === void 0) return;
      const r = pl.sauf ? deplacerBatiment(this.partie, pl.sauf, pl.x, pl.y) : construireBatiment(this.partie, pl.id, pl.x, pl.y);
      if (!r) {
        this.toast("Impossible ici.");
        return;
      }
      this.scene.placement = null;
      this.son.caisse();
      this.sauver();
      const suite = () => {
        this.scene.selection = r.batiment.uid;
        this.montrer(ecranFicheBatiment(this, r.batiment.uid));
      };
      const annoncer = (liste) => {
        if (!liste.length) {
          suite();
          return;
        }
        const [c3, ...reste] = liste;
        this.son.niveau();
        this.montrer(ecranCelebration(this, `COMBO : ${c3.nom} !`, c3.texte, () => annoncer(reste)));
      };
      annoncer(r.combos);
    }
    annulerGP() {
      this.partie.gp = null;
      this.sauver();
      this.montrer(ecranGarage(this));
      this.ecran = "garage";
    }
    abandonnerGP() {
      this.partie.gp = null;
      this.sauver();
      this.garage();
    }
  };
  var app = new App();
  app.demarrer();
  window.pistonville = app;
})();

</script>
